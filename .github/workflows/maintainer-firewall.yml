name: Maintainer Firewall

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: maintainer-firewall-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: Hephaestus-DevKit/maintainer-firewall@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          report-json-path: maintainer-firewall-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: maintainer-firewall-report
          path: maintainer-firewall-report.json
          if-no-files-found: ignore
