name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Pack release asset
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
      - name: Attest release asset
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*.tgz
      - name: Stage attestation bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "${{ steps.attest.outputs.bundle-path }}" "release-assets/maintainer-firewall-${version}.tgz.sigstore.json"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: release-assets/*
