name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20
          cache: npm
      - name: Check release tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The release tag must match package.json (v$version)."
            exit 1
          fi
      - run: npm ci
      - run: npm run release:check
      - name: Pack release asset
        id: pack
        run: |
          mkdir -p release-assets
          filename="$(npm pack --pack-destination release-assets)"
          printf 'asset-path=release-assets/%s\n' "$filename" >> "$GITHUB_OUTPUT"
      - name: Attest release asset
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ steps.pack.outputs.asset-path }}
      - name: Stage attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          RELEASE_ASSET: ${{ steps.pack.outputs.asset-path }}
        run: cp -- "$ATTESTATION_BUNDLE" "$RELEASE_ASSET.sigstore.json"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            ${{ steps.pack.outputs.asset-path }}
            ${{ steps.pack.outputs.asset-path }}.sigstore.json
